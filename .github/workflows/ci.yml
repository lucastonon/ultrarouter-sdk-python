name: ci

# Runs on manual dispatch only (`gh workflow run ci.yml`): the maintainers run the same list locally with
# `make check` before every push. Restore `push: branches: [main]` and `pull_request:` here to run it on
# every change.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install
        run: |
          uv lock --check
          uv sync
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format (ruff format --check)
        run: uv run ruff format --check .
      - name: Types (mypy --strict)
        run: uv run mypy
      - name: Synced specification and generated files are current
        run: |
          uv run python scripts/sync_openapi.py --check
          uv run python scripts/gen_types.py --check
          uv run python scripts/gen_docs.py --check
      - name: Tests (unit, endpoint coverage, parity, timeouts, repository checks)
        run: uv run pytest --ignore=tests/test_docs.py --ignore=tests/test_examples.py
      - name: Doctests (every Python block in README, AGENTS.md and docs/)
        run: uv run pytest tests/test_docs.py
      - name: Examples (every script in examples/)
        run: uv run pytest tests/test_examples.py

  lowest:
    name: lowest supported dependencies (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install the development environment
        run: uv sync
      - name: Tests with httpx, pydantic, typing-extensions and openai at their floors
        run: bash scripts/lowest_deps.sh

  package:
    name: build, smoke and leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the leak scan reads every commit
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Build (uv build) and validate (twine check --strict)
        run: |
          uv build --out-dir dist
          uv run twine check --strict dist/*
      - name: Wheel and sdist smoke (Python 3.10 and 3.14, against the mock gateway)
        run: bash scripts/smoke.sh
        env:
          SKIP_BUILD: "1"
          SMOKE_PYTHONS: "3.10 3.14"
      - name: Leak scan (working tree, git history and built distributions)
        # Organisation-specific rules come from the optional LEAK_PATTERNS_JSON secret (never
        # available to pull requests from forks); their findings print only a location.
        env:
          LEAK_PATTERNS_JSON: ${{ secrets.LEAK_PATTERNS_JSON }}
        run: |
          if [ -n "${LEAK_PATTERNS_JSON}" ]; then
            printf '%s' "${LEAK_PATTERNS_JSON}" > "${RUNNER_TEMP}/leak-patterns.json"
            export ULTRAROUTER_LEAK_PATTERNS_FILE="${RUNNER_TEMP}/leak-patterns.json"
          fi
          uv run python scripts/leak_scan.py --dist dist --redact-external
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  parity:
    # Regenerates the cross-language parity goldens from the TypeScript SDK and fails on drift.
    # Runs only when the repository variable TS_SDK_REPOSITORY (owner/name) is set.
    name: parity goldens vs the TypeScript SDK
    if: ${{ vars.TS_SDK_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.TS_SDK_REPOSITORY }}
          path: ts-sdk
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Build the TypeScript SDK
        working-directory: ts-sdk
        run: |
          npm ci
          npm run build
      - name: Check the goldens
        run: node scripts/gen_parity_goldens.mjs --ts-sdk ts-sdk --check
